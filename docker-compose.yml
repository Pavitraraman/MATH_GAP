version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: math-gap-postgres
    environment:
      POSTGRES_DB: math_gap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: math-gap-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/math_gap
      - APP_NAME=math-gap
      - APP_ENV=production
    depends_on:
      - postgres
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: math-gap-frontend
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "dashboard/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      - BACKEND_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
